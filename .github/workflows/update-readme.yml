# Free, no-AI automation: refreshes README daily and whenever LEARNING_LOG.md changes.
name: Update profile README

on:
  schedule:
    - cron: "30 1 * * *"        # 07:00 IST every day (cron is UTC)
  push:
    paths:
      - "LEARNING_LOG.md"
  workflow_dispatch:            # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild README sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
             git diff --cached --quiet || git commit -m "chore: auto-update README"
          git pull --rebase origin main
          git push
